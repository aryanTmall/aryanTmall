<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <defs>
    <!-- Background & Glass Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190B12"/>
      <stop offset="50%" stop-color="#10070C"/>
      <stop offset="100%" stop-color="#150810"/>
    </linearGradient>

    <radialGradient id="burgundyGlow" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#451126" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="roseGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#451126" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="0"/>
    </radialGradient>

    <!-- Laser Underline Gradient -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0"/>
      <stop offset="25%" stop-color="#701A3D"/>
      <stop offset="50%" stop-color="#C77B9B"/>
      <stop offset="75%" stop-color="#E5B5C7"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Technical Grid Pattern -->
    <pattern id="techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#C77B9B" stroke-width="0.5" stroke-opacity="0.07"/>
      <circle cx="24" cy="24" r="0.75" fill="#E5B5C7" fill-opacity="0.2"/>
    </pattern>

    <!-- Filter Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .t-sub { letter-spacing: 0.18em; text-transform: uppercase; }
    .t-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-weight: 800; letter-spacing: 0.05em; }
    .pulse-dot { animation: pulse 2.4s ease-in-out infinite; }
    .orbit-slow { transform-origin: 730px 140px; animation: rotateOrbit 36s linear infinite; }
    .orbit-rev { transform-origin: 730px 140px; animation: rotateOrbitRev 28s linear infinite; }
    .laser-line { stroke-dasharray: 400; stroke-dashoffset: 800; animation: laserSweep 4.5s ease-in-out infinite; }
    .cursor-blink { animation: blink 1.1s steps(2, start) infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 0.35; r: 3.5; }
      50% { opacity: 1; r: 5; }
    }
    @keyframes rotateOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateOrbitRev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes laserSweep {
      0% { stroke-dashoffset: 800; opacity: 0.2; }
      50% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -800; opacity: 0.2; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse-dot, .orbit-slow, .orbit-rev, .laser-line, .cursor-blink {
        animation: none !important;
      }
    }
  </style>

  <!-- Frame Background -->
  <rect width="860" height="280" rx="14" fill="url(#bgGrad)"/>
  <rect width="860" height="280" rx="14" fill="url(#burgundyGlow)"/>
  <rect width="860" height="280" rx="14" fill="url(#roseGlow)"/>
  <rect width="860" height="280" rx="14" fill="url(#techGrid)"/>

  <!-- Border & Titlebar -->
  <rect x="0.5" y="0.5" width="859" height="279" rx="14" fill="none" stroke="#701A3D" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="0" y1="36" x2="860" y2="36" stroke="#451126" stroke-width="1" stroke-opacity="0.8"/>

  <!-- Terminal Window Controls -->
  <circle cx="24" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="5" fill="#27c93f"/>
  <text x="76" y="22" fill="#C77B9B" font-size="11.5" opacity="0.85">Aryan Mall // Digital Profile</text>

  <!-- Status Indicator (Right aligned) -->
  <g transform="translate(640, 18)">
    <circle cx="0" cy="0" r="4" fill="#39d353" class="pulse-dot"/>
    <text x="12" y="4" fill="#E5B5C7" font-size="10.5" font-weight="600" letter-spacing="0.08em">SYSTEM ACTIVE // 2026</text>
  </g>

  <!-- Technical Orbital Geometry (Right Side) -->
  <g opacity="0.35">
    <ellipse cx="730" cy="140" rx="85" ry="85" fill="none" stroke="#701A3D" stroke-width="1"/>
    <ellipse cx="730" cy="140" rx="108" ry="108" fill="none" stroke="#C77B9B" stroke-width="0.75" stroke-dasharray="4 8" class="orbit-slow"/>
    <ellipse cx="730" cy="140" rx="130" ry="130" fill="none" stroke="#E5B5C7" stroke-width="0.5" stroke-dasharray="10 16 2 8" class="orbit-rev"/>
    <circle cx="730" cy="140" r="3" fill="#E5B5C7"/>
    <line x1="715" y1="140" x2="745" y2="140" stroke="#C77B9B" stroke-width="0.75"/>
    <line x1="730" y1="125" x2="730" y2="155" stroke="#C77B9B" stroke-width="0.75"/>
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 20 54 L 20 46 L 28 46" fill="none" stroke="#C77B9B" stroke-width="1.5" opacity="0.6"/>
  <path d="M 840 54 L 840 46 L 832 46" fill="none" stroke="#C77B9B" stroke-width="1.5" opacity="0.6"/>
  <path d="M 20 254 L 20 262 L 28 262" fill="none" stroke="#C77B9B" stroke-width="1.5" opacity="0.6"/>
  <path d="M 840 254 L 840 262 L 832 262" fill="none" stroke="#C77B9B" stroke-width="1.5" opacity="0.6"/>

  <!-- Badge Pill -->
  <g transform="translate(42, 66)">
    <rect width="210" height="24" rx="12" fill="#190B12" stroke="#701A3D" stroke-width="1"/>
    <circle cx="14" cy="12" r="3" fill="#C77B9B"/>
    <text x="26" y="16" fill="#E5B5C7" font-size="10" font-weight="600" letter-spacing="0.1em">PORTFOLIO &amp; REPOSITORY</text>
  </g>

  <!-- Main Hero Title -->
  <text x="40" y="142" fill="#F8F0F3" font-size="46" class="t-title">ARYAN MALL</text>
  <rect x="360" y="108" width="10" height="36" fill="#C77B9B" class="cursor-blink" opacity="0.85"/>

  <!-- Laser Beam Underline -->
  <line x1="40" y1="160" x2="620" y2="160" stroke="url(#laserBeam)" stroke-width="2.5" class="laser-line"/>
  <circle cx="42" cy="160" r="2" fill="#E5B5C7"/>

  <!-- Subtitle / Positioning Statement -->
  <text x="42" y="196" fill="#E5B5C7" font-size="14.5" font-weight="600" class="t-sub">
    AI/ML BUILDER <tspan fill="#701A3D">|</tspan> FULL-STACK DEVELOPER <tspan fill="#701A3D">|</tspan> CREATIVE TECHNOLOGIST
  </text>

  <!-- Editorial Metadata & Coordinate Line -->
  <g transform="translate(42, 236)">
    <text x="0" y="0" fill="#C77B9B" font-size="11.5" font-family="ui-monospace, monospace" opacity="0.9">
      LOC: <tspan fill="#F8F0F3">FARIDABAD, IN</tspan>
      <tspan dx="18" fill="#701A3D">//</tspan>
      <tspan dx="18">FOCUS:</tspan> <tspan fill="#F8F0F3">SCALABLE ARCHITECTURES &amp; INTELLIGENT SYSTEMS</tspan>
    </text>
  </g>
</svg>
